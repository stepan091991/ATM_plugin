name: ATMMachine
version: '0.01_Beta'
main: org.stepan4ek.ATMMachine.ATMMachine
api-version: '1.21'
prefix: ATM
authors: [ Stepan4ek ]
website: https://github.com/stepan091991/ATM_plugin
commands:
  atm:
    description: Open ATM
    usage: /atm
    aliases: [bank]
  bank:
    description: Open Bank
    usage: /bank

permissions:
  atm.reload:
    description: Reload config
    default: op
  atm.open:
    description: Open ATM using the console
    default: op
